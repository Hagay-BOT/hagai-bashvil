<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>חגי בשביל</title>
  <meta name="description" content="איפה חגי עכשיו בשביל ישראל, מהחרמון לאילת.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:site_name" content="חגי בשביל">
  <meta property="og:title" content="חגי בשביל">
  <meta property="og:description" content="חגי הולך את שביל ישראל מהחרמון לאילת. כאן רואים איפה הוא עכשיו.">
  <meta property="og:url" content="https://hagay-bot.github.io/hagai-bashvil/">
  <meta property="og:image" content="https://hagay-bot.github.io/hagai-bashvil/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="חגי בשביל: מפת שביל ישראל">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="חגי בשביל">
  <meta name="twitter:description" content="חגי הולך את שביל ישראל מהחרמון לאילת. כאן רואים איפה הוא עכשיו.">
  <meta name="twitter:image" content="https://hagay-bot.github.io/hagai-bashvil/og.jpg">
  <meta name="theme-color" content="#17303a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="./data/trail-lite.json" as="fetch" crossorigin>
  <link rel="preload" href="./tiles/index.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Karantina:wght@700&display=swap">
</head>
<body>
  <main class="screen" id="screen">
    <div class="scroll" id="overview" tabindex="0" aria-label="מפת כל השביל"><div class="map" id="map"></div></div>
    <div class="scroll" id="local" tabindex="0" aria-label="מפה קרובה"><div id="lwrap"><div class="map" id="lmap"></div></div></div>
    <div class="night-veil"></div>
    <div class="sky" id="sky"></div>
    <div class="wx" id="wx" aria-hidden="true"><i class="cld c1"></i><i class="cld c2"></i><i class="cld c3"></i></div>

    <header class="hud-top">
      <div>
        <h1 class="title">חגי בשביל</h1>
        <div class="chips">
          <div class="status"><span class="dot" id="dot"></span><span id="stxt">טוען…</span></div>
          <div class="status" id="wxchip" hidden><span id="wxtxt"></span></div>
        </div>
      </div>
      <div class="hud-act">
        <button type="button" class="zoom" id="zoom">התקרב אליי</button>
        <button type="button" class="zoom sm" id="replay" hidden>הילוך חוזר</button>
        <a class="zoom sm" id="adminBtn" href="./admin.html" hidden>ניהול</a>
      </div>
    </header>
    <div class="rlabel" id="rlabel" hidden></div>
    <nav class="rail" id="rail" aria-label="קטעי השביל"></nav>
    <div class="zctl"><button type="button" id="zin" aria-label="הגדל">+</button><button type="button" id="zout" aria-label="הקטן">−</button></div>

    <section class="hud-bot">
      <div class="card">
        <button type="button" class="cardmain" id="card" aria-label="פרטי הקטע הנוכחי">
          <span class="where" id="where"></span>
          <span class="nums">
            <span><b id="nKm">0</b><small id="nKmOf">ק"מ</small></span>
            <span><b id="nDay">0</b><small id="nDayOf">יום</small></span>
            <span><b id="nEle">0</b><small>מ' מעל הים</small></span>
          </span>
          <span class="bar"><i id="bar"></i></span>
          <span class="sub" id="sub"></span>
        </button>
        <div class="cardfoot" id="cardfoot" hidden><span class="today" id="today"></span><button type="button" class="link" id="guess" hidden>ניחוש: מתי באילת?</button><button type="button" class="link" id="replayCta" hidden>לצפות בכל הדרך בהילוך חוזר</button></div>
      </div>
    </section>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <button type="button" class="close" id="sheetClose" aria-label="סגור">×</button>
        <div id="sheetContent"></div>
      </div>
    </div>
  </main>
  <footer class="credits">מפה: © תורמי OpenStreetMap · גובה: Tilezen Joerd (AWS Open Data)</footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
