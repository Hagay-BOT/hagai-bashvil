<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>חגי בשביל</title>
  <meta name="description" content="איפה חגי עכשיו בשביל ישראל, מהחרמון לאילת.">
  <meta name="theme-color" content="#17303a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Karantina:wght@700&display=swap">
</head>
<body>
  <main class="screen" id="screen">
    <div class="scroll" id="overview" tabindex="0" aria-label="מפת כל השביל"><div class="map" id="map"></div></div>
    <div class="scroll" id="local" tabindex="0" aria-label="מפה קרובה"><div id="lwrap"><div class="map" id="lmap"></div></div></div>
    <div class="night-veil"></div>

    <header class="hud-top">
      <div>
        <h1 class="title">חגי בשביל</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="stxt">טוען…</span></div>
      </div>
      <button type="button" class="zoom" id="zoom">התקרב אליי</button>
    </header>
    <div class="zctl"><button type="button" id="zin" aria-label="הגדל">+</button><button type="button" id="zout" aria-label="הקטן">−</button></div>

    <section class="hud-bot">
      <button type="button" class="card" id="card" aria-label="פרטי הקטע הנוכחי">
        <span class="where" id="where"></span>
        <span class="nums">
          <span><b id="nKm">0</b><small id="nKmOf">ק"מ</small></span>
          <span><b id="nDay">0</b><small id="nDayOf">יום</small></span>
          <span><b id="nEle">0</b><small>מ' מעל הים</small></span>
        </span>
        <span class="bar"><i id="bar"></i></span>
        <span class="sub" id="sub"></span>
      </button>
    </section>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <button type="button" class="close" id="sheetClose" aria-label="סגור">×</button>
        <div id="sheetContent"></div>
      </div>
    </div>
  </main>
  <footer class="credits">מפה: © תורמי OpenStreetMap · גובה: Tilezen Joerd (AWS Open Data)</footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
